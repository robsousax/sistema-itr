    evento: "Expansão comercial: equipe e marketing maiores, preço mais agressivo; dividendos declarados"
    receita_bruta_mensal: 11700000.00
    margem_bruta: 0.285
    pmr_dias: 47
    pme_dias: 60
    pmp_dias: 60
    taxa_perda_esperada: 0.027
    baixas_incobraveis: 80000.00
  1T26:
    evento: "Aumento da inadimplência: prazo de recebimento e perda esperada sobem"
    receita_bruta_mensal: 11800000.00
    margem_bruta: 0.29
    pmr_dias: 53
    pme_dias: 62
    pmp_dias: 60
    taxa_perda_esperada: 0.040
    baixas_incobraveis: 90000.00
  2T26:
    evento: "Ganho de eficiência: margem se recupera; incobráveis do 1T26 são baixados"
    receita_bruta_mensal: 12200000.00
    margem_bruta: 0.305
    pmr_dias: 49
    pme_dias: 60
    pmp_dias: 62
    taxa_perda_esperada: 0.033
    baixas_incobraveis: 420000.00
  3T26:
    evento: "Crescimento financiado por crédito: CCB de capital de giro e ampliação do galpão"
    receita_bruta_mensal: 12700000.00
    margem_bruta: 0.30
    pmr_dias: 47
    pme_dias: 66
    pmp_dias: 62
    taxa_perda_esperada: 0.030
    baixas_incobraveis: 100000.00

variacao_mensal: 0.015

