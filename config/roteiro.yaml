# Roteiro de negócio da Orbe Suprimentos S.A. (fictícia) — Etapa 4.
#
# O gerador (src/gerar_dados.py) transforma este roteiro em lançamentos contábeis.
# Todos os números são HIPOTÉTICOS. Valores em reais.
# Mesma semente = mesmos lançamentos, centavo por centavo.

semente: 2026

# Mês-base usado para montar o balanço de abertura (31/12/2024) em regime: clientes, estoques,
# fornecedores e obrigações de dezembro saem das mesmas fórmulas usadas no período.
dezembro_2024:
  receita_bruta_mensal: 9800000.00
  margem_bruta: 0.30
  pmr_dias: 45
  pme_dias: 60
  pmp_dias: 60
  taxa_perda_esperada: 0.025

# Um bloco por trimestre. Receita é a média mensal; cada mês varia até ±variacao_mensal.
# taxa_perda_esperada: provisão sobre o saldo de clientes (resultado da matriz da política 3.3).
trimestres:
  1T25:
    evento: "Operação regular"
    receita_bruta_mensal: 10000000.00
    margem_bruta: 0.30
    pmr_dias: 45
    pme_dias: 60
    pmp_dias: 60
    taxa_perda_esperada: 0.025
    baixas_incobraveis: 60000.00
  2T25:
    evento: "Expansão de vendas: mais clientes a receber e mais estoque"
    receita_bruta_mensal: 10600000.00
    margem_bruta: 0.30
    pmr_dias: 46
    pme_dias: 62
    pmp_dias: 60
    taxa_perda_esperada: 0.025
    baixas_incobraveis: 70000.00
  3T25:
